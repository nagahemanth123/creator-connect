<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Creators | Busy Fox</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F7E6E3">
<link rel="icon" type="image/png" href="../assets/fox.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Caveat:wght@500;600;700&display=swap">
<link rel="stylesheet" href="../assets/cc.css">
<style>
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 24px; margin: 18px 0 26px; }
.top h1 { font-size: clamp(40px, 5vw, 64px); }
.top .tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.search { height: 46px; width: 240px; max-width: 100%; border: 1px solid var(--field-line); background: var(--field); border-radius: 999px; padding: 0 18px; font: 400 15px var(--sans); color: var(--ink); }
.search:focus { outline: 2px solid var(--cherry); border-color: transparent; }
.btn.small { height: 46px; padding: 0 18px; font-size: 14.5px; }
.sum { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 0 0 26px; color: var(--warm); font-size: 14.5px; }
.sum b { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 30px; color: var(--cherry); margin-right: 6px; }
.list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; padding-bottom: 64px; }
@media (max-width: 900px) { .list { grid-template-columns: minmax(0, 1fr); } }
.cr { position: relative; background: var(--card); border-radius: 18px; padding: 22px; box-shadow: var(--lift); display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.cr > .tape { top: -12px; left: 26px; --w: 80px; }
.cr:nth-child(even) > .tape { left: auto; right: 26px; --r: 6deg; }
.who { display: flex; gap: 14px; align-items: center; min-width: 0; }
.pic { flex: 0 0 64px; width: 64px; height: 64px; border-radius: 50%; overflow: hidden; background: var(--pink-soft); display: grid; place-items: center; font: italic 500 28px/1 var(--serif); color: var(--cherry); }
.pic img { width: 100%; height: 100%; object-fit: cover; }
.who .t { min-width: 0; }
.who h2 { font-size: 24px; line-height: 1.15; overflow-wrap: anywhere; }
.who h2 a { text-decoration: none; }
.who p { font-size: 13.5px; color: var(--warm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--tint); color: var(--ink-2, var(--warm)); }
.tag.ok { background: var(--pink-soft); color: var(--cherry-dark); }
.tag.post { background: var(--butter); color: var(--ink); }
.tag.bad { background: var(--cocoa); color: var(--cream); }
.picks { border-top: 1.5px dashed var(--line); padding-top: 14px; display: grid; gap: 10px; }
.row { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px; font-size: 14px; align-items: baseline; }
.row > span:first-child { color: var(--hint); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
.row .chips { display: flex; flex-wrap: wrap; gap: 5px; }
.row .chips i { font-style: normal; font-size: 12.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--field); box-shadow: inset 0 0 0 1.5px var(--field-line); }
.none { color: var(--hint); font-size: 14px; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; border-top: 1.5px dashed var(--line); padding-top: 14px; }
.acts .btn { height: 40px; padding: 0 16px; font-size: 13.5px; }
.gate { max-width: 520px; margin: 40px auto 80px; }
.gate .card { display: flex; flex-direction: column; gap: 14px; }
.gate input { height: 52px; border: 1px solid var(--field-line); background: var(--field); border-radius: 12px; padding: 0 16px; font: 400 16px var(--sans); }
.gate input:focus { outline: 2px solid var(--cherry); border-color: transparent; }
.empty { text-align: center; padding: 60px 0 90px; color: var(--warm); }
.act { padding: 8px 0 72px; }
.ev { list-style: none; margin: 0; padding: 0; background: var(--card); border-radius: 18px; box-shadow: var(--soft); overflow: hidden; }
.ev li { display: grid; grid-template-columns: 150px 130px minmax(0, 1fr); gap: 6px 16px; padding: 13px 20px; border-top: 1px solid var(--line); font-size: 14.5px; align-items: baseline; }
.ev li:first-child { border-top: 0; }
.ev .when { color: var(--hint); font-size: 13px; }
.ev .kind { font-weight: 700; font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; }
.ev .k-connected { color: #2E7D4F; } .ev .k-failed, .ev .k-unfinished { color: var(--cherry); } .ev .k-cancelled { color: var(--warm); } .ev .k-start { color: var(--hint); } .ev .k-prefs { color: var(--ink); }
.ev .what { color: var(--ink); overflow-wrap: anywhere; }
.ev .what small { display: block; color: var(--warm); font-size: 13px; margin-top: 2px; }
@media (max-width: 700px) { .ev li { grid-template-columns: minmax(0, 1fr); gap: 2px; } }
.tag.dm { background: #DCEFE3; color: #1F6B41; }
.dm-back { position: fixed; inset: 0; background: rgba(42, 23, 23, .38); display: none; z-index: 40; overflow-y: auto; padding: 32px 16px; }
.dm-back.on { display: block; }
.dm { position: relative; max-width: 820px; margin: 0 auto; background: var(--paper, #F7E6E3); border-radius: 22px; padding: 26px; box-shadow: var(--lift); display: flex; flex-direction: column; gap: 20px; }
.dm h2 { font-size: 32px; }
.dm .x { position: absolute; top: 16px; right: 16px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--card); font-size: 22px; cursor: pointer; color: var(--ink); }
.dm .box { background: var(--card); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.dm .box h3 { font-family: var(--serif); font-weight: 400; font-size: 22px; }
.dm label.l { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; color: var(--hint); }
.dm input[type=text], .dm input[type=url], .dm textarea { width: 100%; border: 1px solid var(--field-line); background: var(--field); border-radius: 12px; padding: 11px 14px; font: 400 15px var(--sans); color: var(--ink); }
.dm textarea { min-height: 84px; resize: vertical; }
.dm input:focus, .dm textarea:focus { outline: 2px solid var(--cherry); border-color: transparent; }
.dm .seg { display: flex; flex-wrap: wrap; gap: 8px; }
.dm .seg button { height: 38px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--field); box-shadow: inset 0 0 0 1.5px var(--field-line); font: 600 13.5px var(--sans); color: var(--ink); cursor: pointer; }
.dm .seg button.on { background: var(--cherry); color: #fff; box-shadow: none; }
.posts { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; max-height: 260px; overflow-y: auto; padding: 2px; }
.posts button { position: relative; aspect-ratio: 1; border: 0; border-radius: 10px; overflow: hidden; padding: 0; cursor: pointer; background: var(--pink-soft); font: 600 11px var(--sans); color: var(--warm); }
.posts img { width: 100%; height: 100%; object-fit: cover; display: block; }
.posts button.on { outline: 3px solid var(--cherry); outline-offset: 1px; }
.posts small { position: absolute; left: 4px; bottom: 4px; background: rgba(0,0,0,.6); color: #fff; border-radius: 6px; padding: 1px 5px; font-size: 10.5px; }
.camp { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; border-top: 1px solid var(--line); padding-top: 12px; }
.camp:first-child { border-top: 0; padding-top: 0; }
.camp .th { width: 56px; height: 56px; border-radius: 10px; overflow: hidden; background: var(--pink-soft); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--cherry); text-align: center; }
.camp .th img { width: 100%; height: 100%; object-fit: cover; }
.camp p { font-size: 14px; overflow-wrap: anywhere; }
.camp small { color: var(--warm); font-size: 12.5px; }
.camp .b { display: flex; gap: 6px; }
.camp .b .btn { height: 36px; padding: 0 12px; font-size: 13px; }
.dmlog { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 13.5px; }
.dmlog li { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px; }
.dmlog .ok { color: #2E7D4F; font-weight: 600; } .dmlog .err { color: var(--cherry); font-weight: 600; }
.warnbox { background: var(--butter); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--cocoa); color: var(--cream); padding: 10px 18px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
	<header class="head">
		<a class="logo" href="../" aria-label="Busy Fox"><span class="mast">Busy<em>Fox</em></span><span class="sub" aria-hidden="true"><span>C</span><span>R</span><span>E</span><span>A</span><span>T</span><span>O</span><span>R</span><span>&nbsp;</span><span>C</span><span>O</span><span>N</span><span>N</span><span>E</span><span>C</span><span>T</span></span></a>
		<div class="head-r"><button class="btn line small" id="lock" type="button" hidden>Lock</button></div>
	</header>

	<section class="gate" id="gate" hidden>
		<div class="card">
			<span class="tape" style="top:-12px;left:30px"></span>
			<p class="hand">busy fox team only</p>
			<h2>Open the <em>creators</em> list</h2>
			<p class="body">Paste the Busy Fox admin key. It stays on this device only.</p>
			<input id="key" type="password" autocomplete="off" placeholder="Admin key">
			<button class="btn red" id="open" type="button">Open</button>
			<p class="msg" id="gmsg"></p>
		</div>
	</section>

	<main id="app" hidden>
		<div class="top">
			<div><p class="hand">who has connected</p><h1>Your <em>creators</em></h1></div>
			<div class="tools">
				<input class="search" id="q" type="search" placeholder="Search name or handle">
				<button class="btn line small" id="copylink" type="button">Copy connect link</button>
				<button class="btn red small" id="refresh" type="button">Refresh</button>
			</div>
		</div>
		<div class="sum" id="sum"></div>
		<div class="list" id="list"></div>
		<section class="act" id="act">
			<div class="top" style="margin-top:0"><div><p class="hand">every tap, last 30 days</p><h2>Recent <em>activity</em></h2></div></div>
			<ol class="ev" id="ev"></ol>
		</section>
	</main>
</div>
<div class="dm-back" id="dmBack"><div class="dm" id="dm" role="dialog" aria-modal="true" aria-label="Auto-DM"></div></div>
<div class="toast" id="toast"></div>
<script src="../assets/config.js"></script>
<script>
(function () {
	var cc = window.CC || {};
	var $ = function (id) { return document.getElementById(id); };
	var KEY = 'cc_admin_key', data = [];
	var LABEL = {comfortable: 'Comfortable on camera', sometimes: 'On camera sometimes', 'prefer not': 'Prefers not on camera'};
	function getKey() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
	function setKey(v) { try { v ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch (e) {} }
	function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('on'); setTimeout(function () { el.classList.remove('on'); }, 1800); }
	function copy(t, msg) { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { toast(msg || 'Copied'); }, function () { prompt('Copy this:', t); }); }
	function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
	function fmtDate(s) { if (!s) return ''; var d = new Date(s); return d.toLocaleDateString('en-IN', {day: 'numeric', month: 'short', year: 'numeric'}); }
	var connectBase = location.origin + location.pathname.replace(/admin\/?$/, '');

	function gate(msg) { $('app').hidden = true; $('lock').hidden = true; $('gate').hidden = false; if (msg) { $('gmsg').textContent = msg; $('gmsg').classList.add('show'); } $('key').focus(); }
	function load() {
		var k = getKey();
		if (!k) return gate();
		$('refresh').disabled = true; $('refresh').textContent = 'Loading…';
		fetch(cc.api + '/admin/accounts', {headers: {Authorization: 'Bearer ' + k}, cache: 'no-store'})
			.then(function (r) { return r.json().then(function (d) { return {s: r.status, d: d}; }); })
			.then(function (x) {
				$('refresh').disabled = false; $('refresh').textContent = 'Refresh';
				if (x.s === 401) { setKey(''); return gate('That key didn’t work.'); }
				if (!x.d.ok) return gate('Could not load: ' + (x.d.error || 'error'));
				data = x.d.accounts.sort(function (a, b) { return (b.connected_at || '').localeCompare(a.connected_at || ''); });
				$('gate').hidden = true; $('app').hidden = false; $('lock').hidden = false;
				render();
				loadEvents(k);
			})
			.catch(function () { $('refresh').disabled = false; $('refresh').textContent = 'Refresh'; toast('No connection'); });
	}
	function chips(arr) { return (arr || []).map(function (v) { return '<i>' + esc(String(v).replace(/^Other: /, '')) + '</i>'; }).join(''); }
	function row(label, html) { return html ? '<div class="row"><span>' + label + '</span><div class="chips">' + html + '</div></div>' : ''; }
	function text(v) { return v ? '<i>' + esc(v) + '</i>' : ''; }
	function render() {
		var q = $('q').value.trim().toLowerCase();
		var list = data.filter(function (a) { return !q || (a.username + ' ' + (a.name || '')).toLowerCase().indexOf(q) >= 0; });
		var withPrefs = data.filter(function (a) { return a.prefs; }).length, withRep = data.filter(function (a) { return a.report; }).length;
		$('sum').innerHTML = '<span><b>' + data.length + '</b>connected</span><span><b>' + withPrefs + '</b>shared their choices</span><span><b>' + withRep + '</b>have a report</span>';
		if (!list.length) { $('list').innerHTML = '<p class="empty">' + (data.length ? 'No match.' : 'Nobody has connected yet. Send creators the connect link.') + '</p>'; return; }
		$('list').innerHTML = list.map(function (a) {
			var p = a.prefs || {};
			var tags = '<span class="tag ' + (a.status === 'ok' ? 'ok' : 'bad') + '">' + (a.status === 'ok' ? 'Connected' : 'Needs reconnect') + '</span>' +
				(a.can_post ? '<span class="tag post">Can post</span>' : '<span class="tag">Read-only</span>') +
				(a.can_dm ? '<span class="tag dm">Auto-DM ready</span>' : '') +
				(a.followers_count != null ? '<span class="tag">' + Number(a.followers_count).toLocaleString('en-IN') + ' followers</span>' : '') +
				'<span class="tag">Since ' + fmtDate(a.connected_at) + '</span>' + (a.ref ? '<span class="tag">Link: ' + esc(a.ref) + '</span>' : '');
			var picks = a.prefs ? (
				row('Formats', chips(p.formats)) + row('Topics', chips(p.topics)) + row('Posts / week', text(p.posts_per_week)) +
				row('Camera', text(LABEL[p.face] || p.face)) + row('Languages', chips(p.languages)) + row('Goal', text(p.goal)) +
				row('Brands', text(p.brands)) + row('Won’t do', text(p.wont_do)) + row('Notes', text(p.notes)) +
				'<div class="row"><span>Saved</span><div class="none">' + fmtDate(p.saved_at) + '</div></div>'
			) : '<p class="none">No choices saved yet.</p>';
			var initial = esc((a.username || '?').charAt(0).toUpperCase());
			return '<article class="cr"><span class="tape"></span>' +
				'<div class="who"><div class="pic" data-src="' + esc(a.profile_picture_url || '') + '">' + initial + '</div><div class="t"><h2><a href="https://www.instagram.com/' + esc(a.username) + '/" target="_blank" rel="noopener">@' + esc(a.username) + '</a></h2><p title="' + esc(a.name) + '">' + esc(a.name || '') + '</p></div></div>' +
				'<div class="tags">' + tags + '</div>' +
				'<div class="picks">' + picks + '</div>' +
				'<div class="acts">' + (a.report ? '<a class="btn red" href="' + esc(a.report.url) + '" target="_blank" rel="noopener">Open report</a><button class="btn line" data-copy="' + esc(a.report.url) + '" data-msg="Report link copied" type="button">Copy report link</button>' : '<span class="none">No report yet</span>') +
					'<button class="btn line" data-dm="' + esc(a.username) + '" type="button">Auto-DM</button>' +
				'</div></article>';
		}).join('');
		[].forEach.call(document.querySelectorAll('.pic[data-src]'), function (el) {
			var src = el.getAttribute('data-src'); if (!src) return;
			var img = new Image(); img.alt = ''; img.referrerPolicy = 'no-referrer';
			img.onload = function () { el.textContent = ''; el.appendChild(img); }; img.src = src;
		});
	}

	var KIND = {start: 'Tapped connect', connected: 'Connected', failed: 'Failed', cancelled: 'Cancelled', prefs: 'Saved choices', unfinished: 'Didn\u2019t finish'};
	var HINT = {unfinished: 'Tapped Continue with Instagram but never came back. Usually she isn\u2019t added as an Instagram Tester yet (Meta shows \u201cApp not active\u201d), or she closed Meta\u2019s page.'};
	function loadEvents(k) {
		fetch(cc.api + '/admin/events?limit=120', {headers: {Authorization: 'Bearer ' + k}, cache: 'no-store'})
			.then(function (r) { return r.json(); })
			.then(function (d) {
				var ev = (d && d.events) || [];
				// a tap with no connect/fail/cancel from the same link within 30 minutes = didn't finish
				var done = ev.filter(function (e) { return e.type !== 'start' && e.type !== 'prefs'; });
				ev.forEach(function (e) {
					if (e.type !== 'start' || Date.now() - Date.parse(e.at) < 30 * 60000) return;
					var t = Date.parse(e.at);
					var hit = done.some(function (x) { var dt = Date.parse(x.at) - t; return dt >= 0 && dt < 30 * 60000 && (x.ref || '') === (e.ref || ''); });
					if (!hit) e.type = 'unfinished';
				});
				var rows = ev.filter(function (e) { return e.type !== 'start'; });
				$('ev').innerHTML = rows.length ? rows.map(function (e) {
					var who = e.username ? '@' + esc(e.username) : (e.ref ? 'link: ' + esc(e.ref) : 'no ?for= name on the link');
					var extra = e.type === 'connected' && e.followers != null ? Number(e.followers).toLocaleString('en-IN') + ' followers' : (e.message || HINT[e.type] || '');
					return '<li><span class="when">' + new Date(e.at).toLocaleString('en-IN', {day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit'}) + '</span><span class="kind k-' + e.type + '">' + (KIND[e.type] || esc(e.type)) + '</span><span class="what">' + who + (extra ? '<small>' + esc(extra) + '</small>' : '') + '</span></li>';
				}).join('') : '<li><span class="what">No connect attempts logged yet (logging started 15 Nov 2026).</span></li>';
			});
	}

	// ---------- Auto-DM: comment a keyword on a post -> the commenter gets the link in a private reply ----------
	var dmState = null; // {who, data, media, edit}
	function api(path, opt) {
		opt = opt || {};
		opt.headers = Object.assign({Authorization: 'Bearer ' + getKey()}, opt.headers || {});
		opt.cache = 'no-store';
		return fetch(cc.api + path, opt).then(function (r) { return r.json(); });
	}
	var SPECIAL = {any: 'Any post', story: 'Story replies', dm: 'Any DM'};
	function thumb(m) { return m ? (m.thumbnail_url || m.media_url || '') : ''; }
	function mediaById(id) { return (dmState.media || []).filter(function (m) { return m.id === id; })[0]; }
	function openDm(who) {
		dmState = {who: who, data: null, media: [], edit: null};
		$('dm').innerHTML = '<button class="x" type="button" data-dmclose aria-label="Close">×</button><p class="hand">comment → DM</p><h2>Auto-DM for <em>@' + esc(who) + '</em></h2><p class="none">Loading…</p>';
		$('dmBack').classList.add('on');
		Promise.all([api('/admin/dm?id=' + encodeURIComponent(who)), api('/admin/media?id=' + encodeURIComponent(who))]).then(function (r) {
			dmState.data = r[0]; dmState.media = (r[1] && r[1].media) || [];
			renderDm();
		}, function () { toast('No connection'); });
	}
	function closeDm() { $('dmBack').classList.remove('on'); dmState = null; }
	function blankCamp() { return {media_id: (dmState.media[0] || {}).id || 'any', match: 'keyword', keywords: ['LINK'], dm_text: 'Hi! 💛 Here’s the link you asked for: {link}', link: '', public_reply: 'Sent it to your DMs! 📩', active: true}; }
	function renderDm() {
		var d = dmState.data || {}, who = dmState.who;
		var dmLink = connectBase + '?mode=dm&for=' + encodeURIComponent(who);
		var h = '<button class="x" type="button" data-dmclose aria-label="Close">×</button><p class="hand">comment → DM</p><h2>Auto-DM for <em>@' + esc(who) + '</em></h2>';
		if (!d.can_dm) {
			h += '<div class="warnbox"><b>Not switched on for this account yet.</b> She needs to connect once more with comment &amp; message access. Send her this link (she must be an Instagram Tester until Meta approves auto-DM):<br><br><button class="btn red small" type="button" data-copy="' + esc(dmLink) + '" data-msg="Auto-DM connect link copied">Copy auto-DM connect link</button></div>';
		} else if (d.webhook && !d.webhook.ok) {
			h += '<div class="warnbox">Comment alerts aren’t subscribed for this account yet. <button class="btn line small" type="button" data-dmsub>Try again</button></div>';
		}
		var camps = d.campaigns || [];
		h += '<div class="box"><h3>Campaigns</h3>' + (camps.length ? camps.map(function (c) {
			var m = mediaById(c.media_id), t = thumb(m);
			var what = c.match === 'any' ? 'any comment' : 'comment ' + (c.keywords || []).map(function (k) { return '“' + esc(k) + '”'; }).join(' or ');
			return '<div class="camp"><div class="th">' + (t ? '<img src="' + esc(t) + '" alt="" referrerpolicy="no-referrer">' : esc(SPECIAL[c.media_id] || 'Post')) + '</div>' +
				'<div><p><b>' + (c.active ? '🟢 On' : '⚪️ Off') + '</b> · ' + what + ' → DM' + (c.public_reply ? ' + public reply' : '') + '</p><small>' + esc(c.link || 'no link') + (m && m.caption ? ' · ' + esc(m.caption.slice(0, 50)) : (SPECIAL[c.media_id] ? ' · ' + SPECIAL[c.media_id] : '')) + '</small></div>' +
				'<div class="b"><button class="btn line" type="button" data-dmedit="' + esc(c.id) + '">Edit</button><button class="btn line" type="button" data-dmtoggle="' + esc(c.id) + '">' + (c.active ? 'Pause' : 'Turn on') + '</button><button class="btn line" type="button" data-dmdel="' + esc(c.id) + '">Delete</button></div></div>';
		}).join('') : '<p class="none">No campaigns yet.</p>') + '<div><button class="btn red small" type="button" data-dmnew>+ New campaign</button></div></div>';
		if (dmState.edit) h += formHtml(dmState.edit);
		var log = d.log || [];
		h += '<div class="box"><h3>Recent auto-DMs</h3>' + (log.length ? '<ol class="dmlog">' + log.slice(0, 30).map(function (e) {
			var ok = e.dm === 'ok';
			return '<li><span class="none">' + new Date(e.at).toLocaleString('en-IN', {day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit'}) + '</span><span><span class="' + (ok ? 'ok' : 'err') + '">' + (ok ? 'Sent' : 'Not sent') + '</span> to @' + esc(e.from) + (e.text ? ' · “' + esc(e.text) + '”' : '') + (ok ? '' : '<br><small>' + esc(e.dm) + '</small>') + (e.reply && e.reply !== 'ok' ? '<br><small>Public reply: ' + esc(e.reply) + '</small>' : '') + '</span></li>';
		}).join('') + '</ol>' : '<p class="none">Nothing sent yet.</p>') +
			'<p class="none" style="font-size:12.5px">Until Meta approves auto-DM for Busy Fox Insights, DMs only reach people with a role on the app (e.g. Instagram Testers). One DM per person per campaign per day.</p></div>';
		$('dm').innerHTML = h;
	}
	function formHtml(c) {
		var opts = ['any', 'story', 'dm'].map(function (k) { return '<button type="button" data-pick="' + k + '" class="' + (c.media_id === k ? 'on' : '') + '">' + SPECIAL[k] + '</button>'; }).join('');
		var posts = (dmState.media || []).map(function (m) {
			var t = thumb(m);
			return '<button type="button" data-pick="' + esc(m.id) + '" class="' + (c.media_id === m.id ? 'on' : '') + '" title="' + esc((m.caption || '').slice(0, 120)) + '">' + (t ? '<img src="' + esc(t) + '" alt="" referrerpolicy="no-referrer" loading="lazy">' : esc(m.media_type)) + '<small>' + (m.media_product_type === 'REELS' ? 'Reel' : fmtDate(m.timestamp)) + '</small></button>';
		}).join('');
		return '<div class="box" id="dmform"><h3>' + (c.id ? 'Edit campaign' : 'New campaign') + '</h3>' +
			'<label class="l">1. Where</label><div class="seg">' + opts + '</div><div class="posts">' + posts + '</div>' +
			'<label class="l">2. When someone…</label><div class="seg"><button type="button" data-match="keyword" class="' + (c.match !== 'any' ? 'on' : '') + '">comments a keyword</button><button type="button" data-match="any" class="' + (c.match === 'any' ? 'on' : '') + '">comments anything</button></div>' +
			'<input type="text" id="f_kw" placeholder="Keywords, comma separated (e.g. LINK, PRICE)" value="' + esc((c.keywords || []).join(', ')) + '"' + (c.match === 'any' ? ' hidden' : '') + '>' +
			'<label class="l">3. Send this DM</label><textarea id="f_text" placeholder="Use {link} where the link should go">' + esc(c.dm_text || '') + '</textarea>' +
			'<input type="url" id="f_link" placeholder="https://… (the link to send)" value="' + esc(c.link || '') + '">' +
			'<label class="l">4. Public reply under the comment (optional)</label><input type="text" id="f_reply" placeholder="Leave empty for no public reply" value="' + esc(c.public_reply || '') + '">' +
			'<div class="seg"><button type="button" data-active="1" class="' + (c.active !== false ? 'on' : '') + '">On</button><button type="button" data-active="0" class="' + (c.active === false ? 'on' : '') + '">Off</button></div>' +
			'<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn red" type="button" data-dmsave>Save campaign</button><button class="btn line" type="button" data-dmcancel>Cancel</button></div><p class="msg" id="f_msg"></p></div>';
	}
	function readForm() {
		var c = dmState.edit;
		c.keywords = ($('f_kw').value || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
		c.dm_text = $('f_text').value; c.link = $('f_link').value.trim(); c.public_reply = $('f_reply').value;
		return c;
	}
	function saveCamp(c) {
		var m = mediaById(c.media_id);
		var body = Object.assign({}, c, {media_caption: m ? (m.caption || '').slice(0, 80) : '', media_permalink: m ? m.permalink : ''});
		return api('/admin/dm?id=' + encodeURIComponent(dmState.who), {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(body)});
	}
	function reloadDm() { return api('/admin/dm?id=' + encodeURIComponent(dmState.who)).then(function (d) { dmState.data = d; renderDm(); }); }
	document.addEventListener('click', function (e) {
		var t = e.target.closest('[data-dm],[data-dmclose],[data-dmnew],[data-dmedit],[data-dmtoggle],[data-dmdel],[data-dmsave],[data-dmcancel],[data-pick],[data-match],[data-active],[data-dmsub]');
		if (!t) { if (e.target === $('dmBack')) closeDm(); return; }
		if (t.hasAttribute('data-dm')) return openDm(t.getAttribute('data-dm'));
		if (!dmState) return;
		if (t.hasAttribute('data-dmclose')) return closeDm();
		if (t.hasAttribute('data-dmnew')) { dmState.edit = blankCamp(); renderDm(); var f = $('dmform'); if (f) f.scrollIntoView({behavior: 'smooth'}); return; }
		if (t.hasAttribute('data-dmcancel')) { dmState.edit = null; return renderDm(); }
		if (t.hasAttribute('data-dmedit')) { var id = t.getAttribute('data-dmedit'); dmState.edit = JSON.parse(JSON.stringify((dmState.data.campaigns || []).filter(function (c) { return c.id === id; })[0] || blankCamp())); renderDm(); var f2 = $('dmform'); if (f2) f2.scrollIntoView({behavior: 'smooth'}); return; }
		if (t.hasAttribute('data-pick')) { readForm(); dmState.edit.media_id = t.getAttribute('data-pick'); return renderDm(); }
		if (t.hasAttribute('data-match')) { readForm(); dmState.edit.match = t.getAttribute('data-match'); return renderDm(); }
		if (t.hasAttribute('data-active')) { readForm(); dmState.edit.active = t.getAttribute('data-active') === '1'; return renderDm(); }
		if (t.hasAttribute('data-dmsave')) {
			var c = readForm(); t.disabled = true;
			return saveCamp(c).then(function (r) {
				if (!r.ok) { t.disabled = false; $('f_msg').textContent = r.error || 'Could not save'; $('f_msg').classList.add('show'); return; }
				dmState.edit = null; toast('Campaign saved'); reloadDm();
			}, function () { t.disabled = false; toast('No connection'); });
		}
		if (t.hasAttribute('data-dmtoggle')) {
			var cid = t.getAttribute('data-dmtoggle'), cc0 = (dmState.data.campaigns || []).filter(function (c) { return c.id === cid; })[0];
			if (!cc0) return; cc0 = Object.assign({}, cc0, {active: !cc0.active});
			return saveCamp(cc0).then(function () { toast(cc0.active ? 'Turned on' : 'Paused'); reloadDm(); });
		}
		if (t.hasAttribute('data-dmdel')) {
			if (!confirm('Delete this campaign?')) return;
			return api('/admin/dm-delete?id=' + encodeURIComponent(dmState.who) + '&cid=' + encodeURIComponent(t.getAttribute('data-dmdel')), {method: 'POST'}).then(function () { toast('Deleted'); reloadDm(); });
		}
		if (t.hasAttribute('data-dmsub')) return api('/admin/subscribe?id=' + encodeURIComponent(dmState.who), {method: 'POST'}).then(function (r) { toast(r.ok ? 'Subscribed' : 'Still failing'); reloadDm(); });
	});
	document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && dmState) closeDm(); });

	$('open').addEventListener('click', function () { var v = $('key').value.trim(); if (!v) return; setKey(v); $('key').value = ''; $('gmsg').classList.remove('show'); load(); });
	$('key').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('open').click(); });
	$('refresh').addEventListener('click', load);
	$('lock').addEventListener('click', function () { setKey(''); data = []; $('list').innerHTML = ''; gate(); });
	$('q').addEventListener('input', render);
	$('copylink').addEventListener('click', function () { copy(connectBase, 'Connect link copied'); });
	document.addEventListener('click', function (e) { var b = e.target.closest('[data-copy]'); if (b) copy(b.getAttribute('data-copy'), b.getAttribute('data-msg')); });
	load();
})();
</script>
</body>
</html>
