<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data deletion | Busy Fox</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F7E6E3">
<link rel="icon" type="image/png" href="../assets/fox.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Caveat:wght@500;600;700&display=swap">
<link rel="stylesheet" href="../assets/cc.css">
<style>
.paper { position: relative; max-width: 820px; margin: 12px auto 72px; background: var(--card); border-radius: 20px; padding: 44px 48px; box-shadow: var(--lift); }
.paper > .tape.t1 { top: -13px; left: 48px; --w: 110px; --r: -5deg; }
.paper > .tape.t2 { top: -11px; right: 56px; --w: 80px; --r: 6deg; }
.paper h1 { font-size: clamp(40px, 5vw, 64px); margin: 6px 0 10px; }
.paper h2 { font-size: 26px; margin: 34px 0 10px; }
.paper p, .paper li { color: var(--warm); font-size: 16px; }
.paper p + p { margin-top: 10px; }
.paper ul { padding-left: 20px; margin: 10px 0 0; }
.paper li + li { margin-top: 6px; }
.paper .lede { color: var(--ink); font-size: 17.5px; margin-top: 14px; padding: 14px 18px; background: var(--tint); border-radius: 12px; }
.paper .small { font-size: 13.5px; color: var(--hint); }
.paper p.hand { font-size: 24px; color: var(--cherry); }
@media (max-width: 600px) { .paper { padding: 34px 18px; } }
</style>
</head>
<body>
<div class="wrap">
	<header class="head">
		<a class="logo" href="../" aria-label="Busy Fox"><span class="mast">Busy<em>Fox</em></span><span class="sub" aria-hidden="true"><span>C</span><span>R</span><span>E</span><span>A</span><span>T</span><span>O</span><span>R</span><span>&nbsp;</span><span>C</span><span>O</span><span>N</span><span>N</span><span>E</span><span>C</span><span>T</span></span></a>
	</header>
	<main class="paper"><span class="tape t1"></span><span class="tape t2 butter"></span>
	<p class="hand">creator connect</p>
  <h1 id="t">Checking your request…</h1>
  <p class="lead" id="d"></p>
  <p class="small" id="c"></p>
	</main>
	<footer class="foot">
		<span><b>Busy Fox Marketing</b></span>
		<span><a href="../privacy/">Privacy</a> · <a href="../">Connect page</a></span>
	</footer>
</div>
<script src="../assets/config.js"></script>
<script>
(function () {
  var code = new URLSearchParams(location.search).get('code') || '';
  var t = document.getElementById('t'), d = document.getElementById('d'), c = document.getElementById('c');
  if (!code) { t.textContent = 'No request code'; d.textContent = 'Open this page from the link Instagram gave you.'; return; }
  c.textContent = 'Confirmation code: ' + code;
  fetch(window.CC.api + '/deletion-status?code=' + encodeURIComponent(code))
    .then(function (r) { return r.json(); })
    .then(function (x) {
      if (x.deleted) { t.textContent = 'Your data has been deleted'; d.textContent = 'Busy Fox has removed your Instagram access key, saved stories, snapshots and form answers.'; }
      else { t.textContent = 'We could not find that request'; d.textContent = 'Please email admin@busyfox.in with the code below and we will check by hand.'; }
    })
    .catch(function () { t.textContent = 'Could not check right now'; d.textContent = 'Please try again in a minute.'; });
})();
</script>
</body>
</html>
